<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>

</head>
<body>
    <h2>장바구니</h2>

    <div>
        <h3>장바구니 리스트 보기</h3>

            <table>
                <tr>
                    <th>카트 아이템 아이디</th>
                    <th>유저 아이디</th>
                    <th>상품 아이디</th>
                    <th>상품 수량</th>
                    <th>장바구니에 담은 날짜</th>
                    <th>수정</th>
                    <th>삭제</th>
                </tr>
                <!--  반복 구간 시작-->
                <tr th:each="cartItem : ${cart_items}">
                    <td><a th:href="@{/show-cart/{id}(id=${cartItem.cartItemId})}"
                           th:text="${cartItem.cartItemId}"></a></td>
                    <td th:text="${cartItem.userId}"></td>
                    <td th:text="${cartItem.prdId}"></td>
                    <td th:text="${cartItem.quantity}"></td>
                    <td th:text="${cartItem.createdAt}"></td>
<!--                    <td th:text="${#dates.format(cart_items.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>-->
                    <td>수정하기</td>
                    <td><a th:href="@{/show-cart/{id}/remove(id=${cartItem.cartItemId})}">삭제하기</a></td>
                </tr>
                <!--  반복 구간 끝-->
            </table>

    </div>

</body>
</html>
