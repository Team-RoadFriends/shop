<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http:/www.ultraq.net.nz/thymeleaf/layout"
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
<form th:action="@{/user/login}" id="logInForm" method="post">
  <ul>
    <li>
      <input type="text" name="email" id="insert_email" placeholder="이메일">
      <input type="password" name="password" id="insert_pw" placeholder="비밀번호">
    </li>
  </ul>
  <button type="submit">로그인</button>
  <a th:href="@{/user/insertMember}">회원가입</a>
</form>
<script th:src="@{/js/login.js}"></script>

</body>
</html>
