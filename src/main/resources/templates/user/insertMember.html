<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http:/www.ultraq.net.nz/thymeleaf/layout"
>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>insertMember</title>
</head>
<body>
<form th:action="@{/user/signUp}" id="signInFrom"  method="post">
  <ul>
    <li>
      <input type="text" name="email" id="insert_email" placeholder="이메일">
      <input type="password" name="password" id="insert_pw" placeholder="비밀번호">
      <input type="text" name="name" id="insert_name" placeholder="이름">
      <input type="text" name="phone" id="insert_phone" placeholder="전화번호">
    </li>
  </ul>
  <button type="submit">회원가입</button>
  <script th:src="@{/js/signIn.js}"></script>
</form>
</body>
</html>
