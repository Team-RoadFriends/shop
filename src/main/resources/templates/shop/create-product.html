<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>쇼핑 상품 등록</title>
</head>
<body>
<h1>✨New!!✨ 상품</h1>
<form id="productForm" th:action="@{/products}" method="post">
    <label for="product_name">상품명: </label>
    <input type="text" id="product_name" name="productName" required><br><br>

    <label for="category_id">카테고리 ID: </label>
    <input type="number" id="category_id" name="categoryId" required><br><br>

    <label for="price">가격: </label>
    <input type="number" id="price" name="price" step="0.01" required><br><br>

    <label for="stock_quantity">재고 수량: </label>
    <input type="number" id="stock_quantity" name="stockQuantity" required><br><br>

    <label for="description">상품 설명: </label>
    <textarea id="description" name="description" required></textarea><br><br>

    <label for="created_at">등록일: </label>
    <input type="datetime-local" id="created_at" name="createAt" required><br><br>

    <button type="submit">상품 등록</button>
</form>
    <script th:src="@{/js/products.js}"></script>
</body>
</html>
